<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>50 States Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1EC; --ink:#1B2420; --muted:#5E6B64; --line:#C9D1CB;
  --sign:#0F6B3E; --sign-ink:#FFFFFF; --sign-edge:#FFFFFF;
  --field:#FFFFFF; --bad:#C62828; --bad-bg:#FDE7E7; --dup:#B45309; --dup-bg:#FEF1DC;
  --good:#0F6B3E; --good-bg:#E1F2E8; --shield:#1D4E9E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151B18; --ink:#E6ECE8; --muted:#94A39B; --line:#2E3934;
    --sign:#127A47; --field:#1D2521; --bad:#FF7B7B; --bad-bg:#3A1C1C;
    --dup:#F5B25A; --dup-bg:#3A2A14; --good:#6FD39E; --good-bg:#16301F; --shield:#5B8BE0;
  }
}
:root[data-theme="dark"]{
  --paper:#151B18; --ink:#E6ECE8; --muted:#94A39B; --line:#2E3934;
  --sign:#127A47; --field:#1D2521; --bad:#FF7B7B; --bad-bg:#3A1C1C;
  --dup:#F5B25A; --dup-bg:#3A2A14; --good:#6FD39E; --good-bg:#16301F; --shield:#5B8BE0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Overpass","Highway Gothic","Arial Narrow",Arial,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:clamp(2rem,7vw,2.8rem);font-weight:900;line-height:1;margin:8px 0 6px;letter-spacing:-.01em}
.intro{color:var(--muted);margin:0 0 20px}
.player{display:flex;gap:8px;align-items:center;margin-bottom:18px}
.player label{font-weight:600}
.player input{flex:1}

/* Sticky highway-sign timer */
.sign-wrap{position:sticky;top:10px;z-index:5;margin-bottom:18px}
.sign{background:var(--sign);color:var(--sign-ink);border-radius:10px;
  box-shadow:inset 0 0 0 3px var(--sign), inset 0 0 0 5px var(--sign-edge);
  padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.sign .time{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.sign .count{text-align:right;font-weight:600;line-height:1.15}
.sign .count b{display:block;font-size:1.5rem;font-weight:900}
.sign.done{background:#1D4E9E;box-shadow:inset 0 0 0 3px #1D4E9E, inset 0 0 0 5px #fff}

ol{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.num{width:2.2em;text-align:right;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
input[type=text]{width:100%;font:inherit;font-size:1.05rem;padding:9px 12px;border-radius:6px;
  border:1.5px solid var(--line);background:var(--field);color:var(--ink)}
input[type=text]:focus{outline:3px solid var(--shield);outline-offset:1px;border-color:var(--shield)}
li.bad input{border-color:var(--bad);background:var(--bad-bg)}
li.dup input{border-color:var(--dup);background:var(--dup-bg)}
li.blank input{border-style:dashed;border-color:var(--bad)}
li.ok input{border-color:var(--good);background:var(--good-bg)}
.tag{font-size:.8rem;font-weight:700;min-width:5.5em}
li.bad .tag{color:var(--bad)} li.dup .tag{color:var(--dup)} li.blank .tag{color:var(--bad)}

.actions{display:flex;gap:10px;margin-top:20px}
button{font:inherit;font-weight:800;font-size:1.1rem;border-radius:8px;padding:14px 20px;cursor:pointer;border:0}
.submit{flex:1;background:var(--sign);color:#fff}
.reset{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button:focus-visible{outline:3px solid var(--shield);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.overlay.show{display:flex}
.modal{background:var(--paper);color:var(--ink);border-radius:14px;max-width:420px;width:100%;padding:24px;text-align:center}
.modal h2{font-size:3rem;font-weight:900;margin:0;line-height:1;color:var(--bad)}
.modal.win h2{color:var(--good)}
.modal p{margin:12px 0}
.modal ul{text-align:left;margin:8px 0 16px;padding-left:20px;color:var(--muted)}
.modal button{width:100%;background:var(--ink);color:var(--paper)}
@media (prefers-reduced-motion:no-preference){
  .modal.shake{animation:shake .45s}
  @keyframes shake{20%,60%{transform:translateX(-10px) rotate(-2deg)}40%,80%{transform:translateX(10px) rotate(2deg)}}
}

.board{margin-top:36px}
.board h3{font-size:1.3rem;margin:0 0 8px}
.board table{width:100%;border-collapse:collapse}
.board td{padding:6px 4px;border-bottom:1px solid var(--line)}
.board td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.board .empty{color:var(--muted)}
.linkish{background:none;color:var(--muted);font-size:.9rem;padding:6px 0;font-weight:600;text-decoration:underline}
</style>
</head>
<body>
<main>
  <h1>Name all 50 states</h1>
  <p class="intro">The clock starts on your first keystroke. Press Enter to jump to the next line. Spelling counts, capitalization doesn't.</p>

  <div class="player">
    <label for="who">Player</label>
    <input type="text" id="who" placeholder="Your name" autocomplete="off">
  </div>

  <div class="sign-wrap">
    <div class="sign" id="sign">
      <div class="time" id="time">0:00.0</div>
      <div class="count"><b id="filled">0</b>of 50 filled</div>
    </div>
  </div>

  <ol id="list"></ol>

  <div class="actions">
    <button class="submit" id="submit">Submit answers</button>
    <button class="reset" id="reset">Start over</button>
  </div>

  <section class="board">
    <h3>Fastest times on this device</h3>
    <table><tbody id="board"></tbody></table>
    <button class="linkish" id="clearBoard">Clear times</button>
  </section>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal">
    <h2 id="mTitle"></h2>
    <p id="mBody"></p>
    <ul id="mList"></ul>
    <button id="mClose">Back to it</button>
  </div>
</div>

<script>
const STATES = ["Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming"];
const norm = s => s.toLowerCase().replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
const VALID = new Set(STATES.map(norm));

const list = document.getElementById("list");
const timeEl = document.getElementById("time");
const filledEl = document.getElementById("filled");
const sign = document.getElementById("sign");
const submitBtn = document.getElementById("submit");
const who = document.getElementById("who");
let start = null, raf = null, finished = false, finalMs = 0;

for (let i = 0; i < 50; i++) {
  const li = document.createElement("li");
  li.innerHTML = `<span class="num">${i+1}</span><input type="text" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="State ${i+1}">`;
  list.appendChild(li);
}
const inputs = [...list.querySelectorAll("input")];

function fmt(ms){
  const m = Math.floor(ms/60000), s = Math.floor(ms/1000)%60, t = Math.floor(ms/100)%10;
  return `${m}:${String(s).padStart(2,"0")}.${t}`;
}
function tick(){ timeEl.textContent = fmt(performance.now()-start); raf = requestAnimationFrame(tick); }
function startTimer(){ if (start===null && !finished){ start = performance.now(); tick(); } }

inputs.forEach((inp, i) => {
  inp.addEventListener("input", () => {
    startTimer();
    inp.parentElement.className = "";
    filledEl.textContent = inputs.filter(x => x.value.trim()).length;
  });
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      if (i < 49) inputs[i+1].focus(); else submitBtn.focus();
    }
  });
});

function lev(a, b){
  const d = Array.from({length:a.length+1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
// A misspelling = not an exact state, but within a couple of letters of one
function isMisspelling(v){
  const limit = v.length >= 10 ? 3 : 2;
  for (const st of VALID) if (lev(v, st) <= limit) return true;
  return false;
}

function check(){
  if (finished) return;
  const seen = new Set();
  let ok = true, firstTypo = null;
  inputs.forEach(inp => {
    const li = inp.parentElement;
    const v = norm(inp.value);
    li.className = "";
    if (!v || seen.has(v)) { ok = false; }
    else if (!VALID.has(v)) {
      ok = false;
      if (v.length >= 3 && isMisspelling(v)) { li.className = "bad"; firstTypo = firstTypo || inp; }
    }
    seen.add(v);
  });
  if (ok) return win();
  const msg = firstTypo
    ? "Something's wrong. Red lines are spelled wrong, and that might not be everything. The clock is still running."
    : "Something's wrong or repeated. Find it yourself. The clock is still running.";
  showModal(false, "Dumb dumb!", msg, []);
  closeFocus = firstTypo || (document.activeElement === submitBtn ? inputs[inputs.length-1] : document.activeElement);
}

function win(){
  finished = true;
  cancelAnimationFrame(raf);
  finalMs = start===null ? 0 : performance.now()-start;
  timeEl.textContent = fmt(finalMs);
  sign.classList.add("done");
  inputs.forEach(x => { x.readOnly = true; x.parentElement.className = "ok"; });
  submitBtn.disabled = true;
  const name = who.value.trim() || "Mystery player";
  saveTime(name, finalMs);
  showModal(true, "All 50!", `${name} finished in ${fmt(finalMs)}. Hand it over and hit Start over.`, []);
  closeFocus = document.getElementById("reset");
}

let closeFocus = null;
const overlay = document.getElementById("overlay"), modal = document.getElementById("modal");
function showModal(isWin, title, body, items){
  document.getElementById("mTitle").textContent = title;
  document.getElementById("mBody").textContent = body;
  document.getElementById("mList").innerHTML = items.map(t => `<li>${t.replace(/</g,"&lt;")}</li>`).join("");
  modal.className = "modal " + (isWin ? "win" : "shake");
  overlay.classList.add("show");
  document.getElementById("mClose").textContent = isWin ? "Nice" : "Back to it";
  document.getElementById("mClose").focus();
}
function closeModal(){ overlay.classList.remove("show"); if (closeFocus) closeFocus.focus(); }
document.getElementById("mClose").onclick = closeModal;
overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && overlay.classList.contains("show")) closeModal(); });

submitBtn.onclick = check;
document.getElementById("reset").onclick = () => {
  if (!finished && start !== null && !confirm("Wipe this attempt and reset the clock?")) return;
  cancelAnimationFrame(raf); start = null; finished = false;
  timeEl.textContent = "0:00.0"; filledEl.textContent = "0";
  sign.classList.remove("done"); submitBtn.disabled = false;
  inputs.forEach(x => { x.value = ""; x.readOnly = false; x.parentElement.className = ""; });
  who.value = ""; window.scrollTo({top:0}); who.focus();
};

// Leaderboard (this browser only)
const KEY = "states-race-times";
function loadTimes(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function saveTime(name, ms){
  const t = loadTimes(); t.push({name, ms, at: Date.now()}); t.sort((a,b)=>a.ms-b.ms);
  try { localStorage.setItem(KEY, JSON.stringify(t.slice(0,10))); } catch {}
  renderBoard();
}
function renderBoard(){
  const t = loadTimes(), tb = document.getElementById("board");
  tb.innerHTML = t.length ? t.map((r,i)=>`<tr><td>${i+1}. ${r.name.replace(/</g,"&lt;")}</td><td>${fmt(r.ms)}</td></tr>`).join("")
    : `<tr><td class="empty">No finished runs yet.</td><td></td></tr>`;
}
document.getElementById("clearBoard").onclick = () => { try { localStorage.removeItem(KEY); } catch {} renderBoard(); };
renderBoard();
</script>
</body>
</html>
