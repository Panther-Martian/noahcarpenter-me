<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Noah</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F6;--dots:#E1E6EB;--ink:#28313B;--muted:#6B7A88;--accent:#A8752F;--accent-ink:#8A6224;--line:#28313B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A2027;--dots:#232C35;--ink:#E8EDF2;--muted:#93A3B2;--accent:#D9A85C;--accent-ink:#E8BE7A;--line:#3A4854}}
:root[data-theme="dark"]{--bg:#1A2027;--dots:#232C35;--ink:#E8EDF2;--muted:#93A3B2;--accent:#D9A85C;--accent-ink:#E8BE7A;--line:#3A4854}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  color:var(--ink);font-family:"Fredoka","Trebuchet MS",sans-serif;line-height:1.6;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dots) 1.5px,transparent 1.6px);
  background-size:22px 22px;padding:16px;text-align:center}
h1{font-family:"Lilita One","Impact",sans-serif;font-weight:400;margin:0;line-height:1;
  font-size:clamp(3rem,12vw,5rem);color:var(--accent);text-shadow:2px 2px 0 var(--line)}
p{color:var(--muted);margin:20px 0 28px}
a{color:var(--ink);font-weight:500;text-decoration:none;border-bottom:2px solid var(--accent);padding-bottom:1px}
a:hover,a:focus-visible{color:var(--accent-ink);outline:none}
</style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>Nothing here.</p>
    <a href="/">Back home</a>
  </div>
</body>
</html>
