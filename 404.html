<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Noah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7F0;--dots:#EDE6D6;--ink:#2B1B5A;--muted:#6A5C90;--accent:#E24A72;--line:#2B1B5A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1436;--dots:#241A48;--ink:#F2ECFF;--muted:#A79BD0;--accent:#FF7EA5;--line:#4B3A86}}
:root[data-theme="dark"]{--bg:#1B1436;--dots:#241A48;--ink:#F2ECFF;--muted:#A79BD0;--accent:#FF7EA5;--line:#4B3A86}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  color:var(--ink);font-family:"Fredoka","Trebuchet MS",sans-serif;line-height:1.6;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dots) 1.5px,transparent 1.6px);
  background-size:22px 22px;padding:16px;text-align:center}
h1{font-family:"Bungee","Impact",sans-serif;font-weight:400;margin:0;line-height:1;
  font-size:clamp(3rem,12vw,5rem);color:var(--accent);text-shadow:2px 2px 0 var(--line);
  transform:rotate(-1.5deg)}
p{color:var(--muted);margin:20px 0 28px}
a{color:var(--ink);font-weight:500;text-decoration:none;border-bottom:2px solid var(--accent);padding-bottom:1px}
a:hover,a:focus-visible{color:var(--accent);outline:none}
</style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>Nothing here.</p>
    <a href="/">Back home</a>
  </div>
</body>
</html>
